[package]
name = "fuji-recipe-studio"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "A fast, local Windows darkroom for approximate Fujifilm recipe looks"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "25", default-features = false, features = ["dx12", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rawler = "=0.8.0"
rayon = "1"
regex = "1"
rfd = "0.15"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
ureq = "2.12"
url = "2"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "FujiRecipeStudio"
path = "src/main.rs"
